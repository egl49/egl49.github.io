# ==========================================
# RESEARCH EXPERIENCES
# ==========================================

- id: "simulating-extreme-spacetimes"
  title: "Numerical Relativity of Neutron Star Binaries"
  type: "research"
  organization: "Simulating eXtreme Spacetimes (SXS)"
  advisor: "Prof. Nils Deppe"
  term: "Aug 2025 - Present"
  image: ""
  description: "I work to implement a modified version of the Tolman–Oppenheimer–Volkoff equations in Python to numerically solve theoretical neutron stars with different equations of state (EOS). I have improved the precision of the simulated solutions by performing a rigorous expansion of the coupled ODE’s near the center of the star, and I am currently working to implement this improvement into the C++ SpECTRE code base. I am also investigating neutron star binary waveforms with degenerate tidal deformability factors, but different internal EOS, which will allow me to determine whether future observatories will have a high enough resolution to tell us anything new about neutron star microphysics. "
  skills: ["Python", "C++", "Numerical Relativity", "SpECTRE", "Data Analysis", "Computational Physics", "General Relativity", "Fluid Dynamics", "Relativity", "Theoretical Physics"]

- id: "yerkes-observatory"
  title: "Observational/Historical Astronomy of Nebular Growth"
  type: "research"
  organization: "Yerkes Observatory"
  advisor: "Dr. Amanda Bauer"
  term: "May 2025 - Aug 2025"
  image: "color_dumbbell.jpeg"
  description: "I conducted a study that examined the growth of the Dumbbell Nebula (M27) over a period of 119 years. I digitized historical M27 observations from the Yerkes glass plate collection and created a data reduction and analysis pipeline in Python to compare these plates with observations I took using the CMOS camera attached to the Yerkes 41” Reflector. I utilized several different Python packages and publicly available astronomy software programs to center each image on the central white dwarf and determine the change in M27’s radius over time. 
"
  skills: ["SAO DS9", "AstrolmageJ", "Siril", "Observational Astronomy", "Astrophysics", "Telescope", "Image Analysis", "Digital Imaging", "Big Data", "Historical Research", "Historic Preservation", "Data Analysis", "Research Skills"]

- id: "time-cii"
  title: "Observational Cosmology Calibration and Instrumentation"
  type: "research"
  organization: "Tomographic Ionized Carbon Intensity Mapping Experiment (TIME)"
  advisor: "Prof. Abigail Crites"
  term: "Jan 2025 - May 2025"
  image: "cryo_group_square.jpeg"
  description: "I implemented a Python calibration pipeline to maximize the number of viable TES Bolometers (TESB) in the TIME detector array. Each TESB required a specific transition temperature anywhere from 450-700 mK due to manufacturing inconsistencies, so I plotted the resistance curves of each column of detectors to determine the optimal current to pass. I also installed the detectors, tested the wiring of the cryostat, used a crane to assemble and disassemble the instrument, and worked on code to control an IR source array on a motor stepper to generate test observational data. "
  skills: ["Cryogenics", "Electronics", "Cosmology", "Hardware", "Hardware Installation", "Troubleshooting", "Astrophysics", "Telescope", "Experimental Physics"]

